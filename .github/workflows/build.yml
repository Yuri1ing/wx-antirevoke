name: Build anti-revoke dylib

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 查看工具链
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: 编译 dylib
        env:
          MIN_IOS: "15.0"
          # 微信 8.0.75 的 IPA 里只有 arm64 一个 slice，编 arm64 即可。
          # 额外编 arm64e 反而会引入 PAC 指针签名的额外风险。
          ARCHS: "arm64"
        run: |
          chmod +x build.sh
          ./build.sh

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: wxantirevoke-dylib
          path: |
            build/wxantirevoke.dylib
          if-no-files-found: error
          retention-days: 30

      - name: 算产物校验值
        id: sum
        run: |
          shasum -a 256 build/wxantirevoke.dylib
          echo "sha=$(shasum -a 256 build/wxantirevoke.dylib | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          ls -l build/wxantirevoke.dylib

      - name: 发布到 Release（公开仓库可匿名下载）
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sum.outputs.sha }}
          RUN: ${{ github.run_number }}
          COMMIT: ${{ github.sha }}
        run: |
          cat > /tmp/notes.md <<EOF
          自动构建产物，对应提交 \`$COMMIT\`。

          - dylib SHA256: \`$SHA\`
          - 目标: 微信 8.0.79 + 底栏液态玻璃
          EOF
          gh release create "build-$RUN" build/wxantirevoke.dylib \
            --title "构建 #$RUN" \
            --notes-file /tmp/notes.md \
            --target "$COMMIT"
